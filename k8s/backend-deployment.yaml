apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dhakacart
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: DOCKERHUB_USER/dhakacart-backend:latest
          ports: [{ containerPort: 4000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: DATABASE_URL
              value: postgres://dhakauser:change_me@postgres:5432/dhakacart
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: dhakacart }
spec:
  selector: { app: backend }
  ports: [{ port: 4000, targetPort: 4000 }]
